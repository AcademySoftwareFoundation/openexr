name: Publish Release Notice to ASWF Slack

on:
  release:
    types:
      - published
      # published should cover both 'released' and 'prereleased'
  # Allow re-sending the announcement manually, e.g. if the release
  # event run failed. Provide the tag of an already-published release;
  # the notes, title, and URL are fetched from that release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the published release to announce (e.g. v3.4.18)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: 'Prepare Slack-safe release notes'
      id: notes
      # Resolve the release (from the triggering release event, or from
      # the tag given to workflow_dispatch) and strip the ### Contributors
      # section from the notes, since it has raw html that doesn't translate.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ github.event.inputs.tag }}
        RELEASE_NAME: ${{ github.event.release.name }}
        RELEASE_URL: ${{ github.event.release.html_url }}
        RELEASE_BODY: ${{ github.event.release.body }}
      run: |
        # For a manual run, github.event.release is empty, so fetch the
        # release details for the requested tag from the API instead.
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          release_json=$(gh release view "$INPUT_TAG" --repo "$REPO" --json name,url,body)
          RELEASE_NAME=$(printf '%s' "$release_json" | jq -r '.name')
          RELEASE_URL=$(printf '%s' "$release_json" | jq -r '.url')
          RELEASE_BODY=$(printf '%s' "$release_json" | jq -r '.body')
        fi

        # This outputs version, url, and:
        #   notes<<DELIMITER
        #    <release notes w/o contributors
        #   DELIMITER
        # which assigns the values to steps.notes.outputs.*
        {
          echo "version=$RELEASE_NAME"
          echo "url=$RELEASE_URL"
        } >> "$GITHUB_OUTPUT"
        delimiter="EOF_$(date +%s)_$RANDOM"
        {
          echo "notes<<$delimiter"
          printf '%s\n' "$RELEASE_BODY" | sed -n '/^### Contributors$/q;p'
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: 'Notify Slack #release-announcements'
      id: slack1
      with:
        project_name: "OpenEXR"
        slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
        slack_channel: "#release-announcements"
        project_logo: "https://artwork.aswf.io/projects/openexr/icon/color/openexr-icon-color.png"
        release_version: ${{ steps.notes.outputs.version }}
        release_url: ${{ steps.notes.outputs.url }}
        release_notes: ${{ steps.notes.outputs.notes }}
      uses: jmertic/slack-release-notifier@4bf7813217739180f89eb869bf769efc07928368 # 20260930

    - name: 'Notify Slack #openexr'
      id: slack2
      with:
        project_name: "OpenEXR"
        slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
        slack_channel: "#openexr"
        project_logo: "https://artwork.aswf.io/projects/openexr/icon/color/openexr-icon-color.png"
        release_version: ${{ steps.notes.outputs.version }}
        release_url: ${{ steps.notes.outputs.url }}
        release_notes: ${{ steps.notes.outputs.notes }}
      uses: jmertic/slack-release-notifier@4bf7813217739180f89eb869bf769efc07928368 # 20260930


      