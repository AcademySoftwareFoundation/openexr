# Copyright (c) Contributors to the OpenEXR Project.

# These are the steps for all CI jobs. Linux, macOS, and Windows all
# share a common set of configure/build/validate steps.  The input
# variables control all variations of the jobs.
#
# Each job validates that the proper files are installed by comparing
# the install_manifest.txt to a reference for that job. This requires
# that each job have a corresponding reference, and that thes
# references are updated when any change is made to the installation
# headers/libraries/cmake/etc.

name: CI Steps

on:
  workflow_call:
    # This inputs receive values via the "with:" section in
    # ci_premerge.yml / ci_full.yml
    inputs:
      name:
        type: string
      os:
        type: string
      container:
        type: string
      cmake:
        type: string
      cxx-standard:
        type: string
      cxx-compiler:
        type: string
      cc-compiler:
        type: string
      build-type:
        type: string
      msystem:
        type: string
      BUILD_SHARED_LIBS:
        type: string
      OPENEXR_ENABLE_THREADING:
        type: string
      OPENEXR_INSTALL_PKG_CONFIG:
        type: string
      OPENEXR_INSTALL_DOCS:
        type: string
      OPENEXR_BUILD_EXAMPLES:
        type: string
      OPENEXR_BUILD_TOOLS:
        type: string
      OPENEXR_FORCE_INTERNAL_IMATH:
        type: string
      OPENEXR_IMATH_TAG:
        type: string
      OPENEXR_FORCE_INTERNAL_DEFLATE:
        type: string
      OPENEXR_FORCE_INTERNAL_ZSTD:
        type: string
      OPENEXR_FORCE_INTERNAL_OPENJPH:
        type: string
      openjph_version:
        type: string
      CMAKE_OSX_ARCHITECTURES:
        type: string
      CMAKE_GENERATOR_PLATFORM:
        type: string
      BUILD_TESTING:
        type: string
      RUN_TESTING:
        type: string
      test_category:
        type: string
      namespace:
        type: string
      validate_install:
        type: string
      configure_install_prefix:
        type: string

permissions:
  contents: read

jobs:
  steps:
    runs-on: ${{ inputs.os }}

    permissions:
      contents: write  # required for actions/upload-artifact

    container:
      image: ${{ inputs.container }}

    env:
      CXX: ${{ inputs.cxx-compiler }}
      CC: ${{ inputs.cc-compiler }}
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node16
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Build Dependencies (Alpine)
        # For Alpine, install bash since it's missing from the base image.
        if: startsWith(inputs.container, 'alpine:')
        run: |
          apk add --no-cache build-base cmake git bash wget pkgconf
        shell: sh

      - name: Set Up Directories & Environment
        run: |
          set -x

          # Be careful to use consistent paths between Windows and
          # Linux. Convert backslashed Windows paths to Linux style via cygpath,
          # i.e. convert D:\a\Imath\Imath to /d/a/Imath/Imath.

          # WORKSPACE is the root of the project directory
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")

              # remember the install location for Imath, libdeflate, openjph
              PROGRAM_FILES=$(cygpath -u "C:/Program Files (x86)")
              echo "PROGRAM_FILES=$PROGRAM_FILES" >> "$GITHUB_ENV"
          else
              WORKSPACE=$GITHUB_WORKSPACE
          fi
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"

          # BUILD_DIR is the CMake build directory
          BUILD_DIR=$WORKSPACE/_build
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          # INSTALL_DIR is the CMake install directory
          INSTALL_DIR=$WORKSPACE/_install
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"

          # Initialize the PATH necessary for the tests on Windows
          echo "OPENEXR_PATH=$INSTALL_DIR/bin:$INSTALL_DIR/lib" >> "$GITHUB_ENV"

          # SCCACHE_DIR is where sccache stores its compiler cache,
          # used by the "Cache sccache" step below.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              SCCACHE_DIR=$(cygpath -w "$WORKSPACE/.sccache")
          else
              SCCACHE_DIR="$WORKSPACE/.sccache"
          fi
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"

          # SANITIZED_NAME is the job's "name" input (e.g. "pkgconfig=OFF,
          # examples=OFF, tools=OFF, docs=OFF, internal deflate"),
          # lower-cased with runs of non-alphanumeric characters (commas,
          # spaces, "=", parens, etc.) collapsed to a single "-". Raw
          # names can't be used directly as cache keys (actions/cache
          # rejects commas) or safely as filenames, so this sanitized
          # form is reused below for both the sccache cache key and the
          # install manifest filename.
          SANITIZED_NAME=$(echo "${{ inputs.name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "SANITIZED_NAME=$SANITIZED_NAME" >> "$GITHUB_ENV"

          # CMAKE_GENERATOR_PLATFORM (e.g. "Win32" for a 32-bit MSVC
          # build) is read by CMake's Visual Studio generator as a
          # default for "-A", so exporting it here as an environment
          # variable covers not just the main configure below but
          # also the dependency pre-install scripts (Imath,
          # libdeflate, zstd, OpenJPH), which each run their own
          # "cmake -S ... -B ..." without an explicit "-A" flag.
          if [ -n "${{ inputs.CMAKE_GENERATOR_PLATFORM }}" ]; then
            echo "CMAKE_GENERATOR_PLATFORM=${{ inputs.CMAKE_GENERATOR_PLATFORM }}" >> "$GITHUB_ENV"
          fi

          # Install gcc for macOS if necessary
          if [[ "${{ inputs.cc-compiler }}" == "gcc" && "$RUNNER_OS" == "macOS" ]]; then
            brew install gcc
          fi

        shell: bash

      - name: Report C Runtime Version
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd --version 2>&1 | head -1 || true
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "macOS SDK: $(xcrun --show-sdk-version 2>/dev/null || echo 'unknown')"
          fi
        shell: bash

      - name: Install Build Dependencies (Fedora)
        if: startsWith(inputs.container, 'fedora:')
        run: |
          dnf install -y gcc gcc-c++ cmake make git wget libdeflate-devel
        shell: bash

      - name: Install sccache
        # sccache speeds up rebuilds by caching compiler output across CI
        # runs. Skipped for msys2 jobs, where PATH/shell interaction with
        # msys2's own shell environment hasn't been validated.
        if: inputs.msystem == ''
        run: |
          set -ex
          SCCACHE_VERSION=0.18.0
          case "$RUNNER_OS" in
            Linux)
              TARGET="$(uname -m)-unknown-linux-musl"
              ;;
            macOS)
              ARCH=$(uname -m)
              [[ "$ARCH" == "arm64" ]] && ARCH=aarch64
              TARGET="${ARCH}-apple-darwin"
              ;;
            Windows)
              TARGET="x86_64-pc-windows-msvc"
              ;;
            *)
              echo "::error::Unsupported RUNNER_OS for sccache: $RUNNER_OS"
              exit 1
              ;;
          esac

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TMP_DIR=$(cygpath -u "$RUNNER_TEMP")
          else
            TMP_DIR="$RUNNER_TEMP"
          fi
          SCCACHE_INSTALL_DIR="$TMP_DIR/sccache"
          mkdir -p "$SCCACHE_INSTALL_DIR"

          ARCHIVE="sccache-v${SCCACHE_VERSION}-${TARGET}.tar.gz"
          URL="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${ARCHIVE}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # wget is guaranteed present (installed explicitly for the
            # Fedora/Alpine container overrides; present by default in
            # the aswf container).
            wget -q -O "$TMP_DIR/$ARCHIVE" "$URL"
          else
            curl -L --retry 3 -o "$TMP_DIR/$ARCHIVE" "$URL"
          fi
          tar -xzf "$TMP_DIR/$ARCHIVE" -C "$SCCACHE_INSTALL_DIR" --strip-components=1

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SCCACHE_INSTALL_DIR=$(cygpath -w "$SCCACHE_INSTALL_DIR")
          fi
          echo "$SCCACHE_INSTALL_DIR" >> "$GITHUB_PATH"
        shell: bash

      - name: Cache sccache
        if: inputs.msystem == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ env.SANITIZED_NAME }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ env.SANITIZED_NAME }}-

      - name: Determine MSYS2 Packages
        if: inputs.msystem != ''
        run: |
          PACKAGES="cc:p cmake:p"
          # mingw32 has no package for imath and openjph
          if [[ "${{ inputs.OPENEXR_FORCE_INTERNAL_IMATH }}" == "OFF" && "${{ inputs.msystem }}" != "MINGW32" ]]; then
            PACKAGES="$PACKAGES imath:p"
          fi
          if [[ "${{ inputs.OPENEXR_FORCE_INTERNAL_OPENJPH }}" == "OFF" && "${{ inputs.msystem }}" != "MINGW32" ]]; then
            PACKAGES="$PACKAGES openjph:p"
          fi
          if [[ "${{ inputs.OPENEXR_FORCE_INTERNAL_DEFLATE }}" == "OFF" ]]; then
            PACKAGES="$PACKAGES libdeflate:p"
          fi
          if [[ "${{ inputs.OPENEXR_FORCE_INTERNAL_ZSTD }}" == "OFF" ]]; then
            PACKAGES="$PACKAGES zstd:p"
          fi
          echo "PACBOY_PACKAGES=$PACKAGES" >> "$GITHUB_ENV"
        shell: bash

      - name: Install MSYS2 ${{ inputs.msystem }}
        if: inputs.msystem != ''
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ inputs.msystem }}
          update: true
          install: git
          pacboy: ${{ env.PACBOY_PACKAGES }}

      - name: Set Up CMake
        # CMakeLists.txt specifies a minimum cmake version of 3.14 for
        # the OpenEXR project, so use that for the CI by default.  But
        # install a specific version to test with if a different one
        # is specified.
        run: |
          set -ex
          CMAKE=cmake
          CTEST=ctest
          if [[ "${{ inputs.cmake }}" != "" && "$RUNNER_OS" == "Linux" ]]; then
            CMAKE_VERSION=${{ inputs.cmake }}
            CURRENT_CMAKE_VERSION=$(cmake --version | head -n 1 | cut -f3 -d' ')
            if [ "$CMAKE_VERSION" != "$CURRENT_CMAKE_VERSION" ]; then
              wget https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-Linux-x86_64.tar.gz
              tar -xzf cmake-$CMAKE_VERSION-Linux-x86_64.tar.gz 
              CMAKE=$(find "$PWD" -type f -path "*/bin/cmake" | head -n 1)
              CTEST=$(find "$PWD" -type f -path "*/bin/ctest" | head -n 1)
            fi
          fi
          echo CMAKE="$CMAKE" >> "$GITHUB_ENV"
          echo CTEST="$CTEST" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Imath
        # Pre-install Imath so the builds validate that find_package sees the external installation
        if: inputs.OPENEXR_FORCE_INTERNAL_IMATH == 'OFF' && inputs.msystem == ''
        run: |
          set -x
          share/ci/scripts/install_imath.sh "${{ inputs.OPENEXR_IMATH_TAG }}"
          echo "OPENEXR_PATH=$OPENEXR_PATH:$PROGRAM_FILES/Imath/bin:$PROGRAM_FILES/Imath/lib" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Imath (msys2)
        # mingw32 has no package for imath, so install manually
        if: inputs.OPENEXR_FORCE_INTERNAL_IMATH == 'OFF' && inputs.msystem == 'MINGW32'
        run: |
          set -x
          share/ci/scripts/install_imath.sh "${{ inputs.OPENEXR_IMATH_TAG }}"
        shell: msys2 {0}

      - name: Install libdeflate
        # Pre-install libdeflate so the builds validate that find_package sees the external installation
        if: inputs.OPENEXR_FORCE_INTERNAL_DEFLATE == 'OFF' && inputs.msystem == ''
        run: |
          set -x
          share/ci/scripts/install_libdeflate.sh 92e6a0db9fa848d742f9eb286c92afc60f2c3dda # v1.26
          echo "OPENEXR_PATH=$OPENEXR_PATH:$PROGRAM_FILES/libdeflate/bin:$PROGRAM_FILES/libdeflate/lib" >> "$GITHUB_ENV"
        shell: bash

      - name: Install zstd
        # Pre-install zstd so the builds validate that find_package sees the external installation
        if: inputs.OPENEXR_FORCE_INTERNAL_ZSTD == 'OFF' && inputs.msystem == ''
        run: |
          set -x
          share/ci/scripts/install_zstd.sh f8745da6ff1ad1e7bab384bd1f9d742439278e99 # v1.5.7
          echo "OPENEXR_PATH=$OPENEXR_PATH:$PROGRAM_FILES/zstd/bin:$PROGRAM_FILES/zstd/lib" >> "$GITHUB_ENV"
        shell: bash

      - name: Install OpenJPH
        # Pre-install OpenJPH so the builds validate finding the external installation
        if: inputs.OPENEXR_FORCE_INTERNAL_OPENJPH == 'OFF' && inputs.msystem == ''
        run: |
          set -x
          share/ci/scripts/install_openjph.sh ${{ inputs.openjph_version }}
          echo "OPENEXR_PATH=$OPENEXR_PATH:$PROGRAM_FILES/openjph/bin:$PROGRAM_FILES/openjph/lib" >> "$GITHUB_ENV"
        shell: bash

      - name: Install OpenJPH (msys2)
        # mingw32 has no package for openjph, so install manually
        if: inputs.OPENEXR_FORCE_INTERNAL_OPENJPH == 'OFF' && inputs.msystem == 'MINGW32'
        run: |
          set -x
          share/ci/scripts/install_openjph.sh ${{ inputs.openjph_version }}
        shell: msys2 {0}

      - name: Install help2man
        # TODO: this could go in the ASWF Linux docker
        # container. Also, it doesn't currently work for Windows, so
        # the windows builds have docs disabled.
        if: inputs.OPENEXR_INSTALL_DOCS == 'ON'
        run: share/ci/scripts/install_help2man.sh
        shell: bash

      - name: Construct CMake command
        run: |
          # Construct the cmake command as a variable, so the
          # Configure step below can execute it, but also so we can store
          # in in the install_manifest as a debugging reference
          # Configure/build with a .tmp install prefix, so we can
          # validate the install properly overrides it.
          cmake_args=("-B" "$BUILD_DIR" -S "$WORKSPACE")
          cmake_args+=("-DCMAKE_INSTALL_PREFIX=$INSTALL_DIR${{ inputs.configure_install_prefix}}")
          cmake_args+=("-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}")
          cmake_args+=("-DOPENEXR_CXX_STANDARD=${{ inputs.cxx-standard }}")
          cmake_args+=("-DBUILD_SHARED_LIBS=${{ inputs.BUILD_SHARED_LIBS }}")
          cmake_args+=("-DOPENEXR_ENABLE_THREADING=${{ inputs.OPENEXR_ENABLE_THREADING }}")
          cmake_args+=("-DOPENEXR_INSTALL_PKG_CONFIG=${{ inputs.OPENEXR_INSTALL_PKG_CONFIG }}")
          cmake_args+=("-DOPENEXR_INSTALL_DOCS=${{ inputs.OPENEXR_INSTALL_DOCS }}")
          cmake_args+=("-DOPENEXR_BUILD_EXAMPLES=${{ inputs.OPENEXR_BUILD_EXAMPLES }}")
          cmake_args+=("-DOPENEXR_BUILD_TOOLS=${{ inputs.OPENEXR_BUILD_TOOLS }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_IMATH=${{ inputs.OPENEXR_FORCE_INTERNAL_IMATH }}")
          cmake_args+=("-DOPENEXR_IMATH_TAG=${{ inputs.OPENEXR_IMATH_TAG }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_DEFLATE=${{ inputs.OPENEXR_FORCE_INTERNAL_DEFLATE }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_ZSTD=${{ inputs.OPENEXR_FORCE_INTERNAL_ZSTD }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_OPENJPH=${{ inputs.OPENEXR_FORCE_INTERNAL_OPENJPH }}")
          cmake_args+=("-DBUILD_TESTING=${{ inputs.BUILD_TESTING }}")
          cmake_args+=("-DOPENEXR_RUN_FUZZ_TESTS=OFF")
          cmake_args+=("-DCMAKE_VERBOSE_MAKEFILE=ON")
          if [ "${{ inputs.msystem }}" == "" ]; then
            cmake_args+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
            cmake_args+=("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          fi
          if [ -n "${{ inputs.namespace }}" ]; then
            cmake_args+=("-DOPENEXR_IMF_NAMESPACE=${{ inputs.namespace }}")
            cmake_args+=("-DILMTHREAD_NAMESPACE=${{ inputs.namespace }}")
            cmake_args+=("-DIEX_NAMESPACE=${{ inputs.namespace }}")
          fi
          if [ "${{ inputs.msystem }}" == "MINGW32" ]; then
            cmake_args+=("-DCMAKE_C_FLAGS=-msse2 -mfpmath=sse")
            cmake_args+=("-DCMAKE_CXX_FLAGS=-msse2 -mfpmath=sse")
          fi
          if [ -n "${{ inputs.CMAKE_OSX_ARCHITECTURES }}" ]; then
              cmake_args+=("CMAKE_OSX_ARCHITECTURES='${{ inputs.CMAKE_OSX_ARCHITECTURES }}'")
          fi

          quoted_args=$(printf '%q ' "${cmake_args[@]}")
          echo "CMAKE_ARGS=$quoted_args" >> "$GITHUB_ENV"

          # Set the install manifest name to include the os and the job's
          # name (sanitized via $SANITIZED_NAME, set in "Set Up
          # Directories & Environment" above), e.g. a name of
          # "clang c++20" becomes install_manifest.macos.clang-c-20.txt.
          # Note that $RUNNER_OS is "Linux", while input.os is "ubuntu".
          os_name=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')  # linux, macos, windows
          echo INSTALL_MANIFEST_FILENAME="install_manifest.${os_name}.${SANITIZED_NAME}.txt" >> "$GITHUB_ENV"
        shell: bash

      - name: Configure, Build, Install
        if: inputs.msystem == ''
        run: |
          set -x
          "$CMAKE" --version
          "$CMAKE" ${{ env.CMAKE_ARGS }}
          # Reconfigure in the same build dir to catch Imath include-path
          # regressions on CMake reconfigure (see #2441).
          if [ "${{ inputs.OPENEXR_FORCE_INTERNAL_IMATH }}" == "ON" ]; then
            "$CMAKE" ${{ env.CMAKE_ARGS }}
          fi
          if [ -n "${{ inputs.configure_install_prefix }}" ]; then
            "$CMAKE" --build "$BUILD_DIR" --config ${{ inputs.build-type }}
            "$CMAKE" --install "$BUILD_DIR" --prefix "$INSTALL_DIR" --config ${{ inputs.build-type }}
          else
            "$CMAKE" --build "$BUILD_DIR" --target install --config ${{ inputs.build-type }}
          fi
        shell: bash

      - name: Show sccache stats
        if: inputs.msystem == ''
        run: sccache --show-stats || true
        shell: bash

      - name: Configure, Build, Install (msys2) # requires msys2 shell
        if: inputs.msystem != ''
        run: |
          set -x
          "$CMAKE" --version
          "$CMAKE" ${{ env.CMAKE_ARGS }}
          # Reconfigure in the same build dir to catch Imath include-path
          # regressions on CMake reconfigure (see #2441).
          if [ "${{ inputs.OPENEXR_FORCE_INTERNAL_IMATH }}" == "ON" ]; then
            "$CMAKE" ${{ env.CMAKE_ARGS }}
          fi
          if [ -n "${{ inputs.configure_install_prefix }}" ]; then
            "$CMAKE" --build "$BUILD_DIR" --config ${{ inputs.build-type }}
            "$CMAKE" --install "$BUILD_DIR" --prefix "$INSTALL_DIR" --config ${{ inputs.build-type }}
          else
            "$CMAKE" --build "$BUILD_DIR" --target install --config ${{ inputs.build-type }}
          fi
        shell: msys2 {0}

      - name: Test OpenEXR.pc
        # Validate that OpenEXR.pc works by compiling/linking the test program
        if: runner.os == 'Linux' && inputs.OPENEXR_INSTALL_PKG_CONFIG == 'ON'
        run: |
          set -x
          ARGS=()
          if [ "${{ inputs.BUILD_SHARED_LIBS }}" == "OFF" ]; then
            ARGS=("-static")
          fi
          share/ci/scripts/validate_pkgconfig.sh "$INSTALL_DIR" website/src/exrwriter/exrwriter.cpp "${ARGS[@]}"
        shell: bash

      - name: Prepare install_manifest
        # Store the cmake command as the first line of the manifest,
        # and remove the path prefix, so the manifest contains only
        # the local filenames.
        run: |
          set -x
          INSTALL_MANIFEST_PATH="$BUILD_DIR/$INSTALL_MANIFEST_FILENAME"
          {
            echo "# SPDX-License-Identifier: BSD-3-Clause"
            echo "# Copyright (c) Contributors to the OpenEXR Project."
            echo "# cmake ${{ env.CMAKE_ARGS }}"
            sort "$BUILD_DIR/install_manifest.txt" | sed -e "s:^.*/_install/::"
          } > "$INSTALL_MANIFEST_PATH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              # upload-artifact expects a windows-style path
              INSTALL_MANIFEST_PATH=$(cygpath -w "$INSTALL_MANIFEST_PATH")
          fi
          echo INSTALL_MANIFEST_PATH="$INSTALL_MANIFEST_PATH" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload install_manifest.txt
        # Upload the manifest to make it possible to download for inspection and debugging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.INSTALL_MANIFEST_FILENAME }}
          path: ${{ env.INSTALL_MANIFEST_PATH }}

      - name: Validate install
        if: inputs.validate_install == 'ON'
        # Validate that the build has installed the proper files by
        #  comparing against the appropriate reference manifest
        run: |
          set -x

          # Extract "#define VAR VALUE" statements from OpenEXRConfig.h
          # and set corresponding env vars, which validate_install.py
          # substitutes in the manifest files. This confirms that the
          # manifests have the proper version strings in the library filenames.
          OpenEXRConfig=$INSTALL_DIR/include/OpenEXR/OpenEXRConfig.h
          for var in \
            OPENEXR_VERSION_MAJOR \
            OPENEXR_VERSION_MINOR \
            OPENEXR_VERSION_PATCH \
            OPENEXR_SOVERSION \
            OPENEXR_IMATH_VERSION_MAJOR \
            OPENEXR_IMATH_VERSION_MINOR \
            OPENEXR_IMATH_VERSION_PATCH \
            OPENEXR_IMATH_SOVERSION \
            OPENEXR_OPENJPH_VERSION_MAJOR \
            OPENEXR_OPENJPH_VERSION_MINOR \
            OPENEXR_OPENJPH_VERSION_PATCH; do
            value=$(grep -E "^#define[[:space:]]+$var" "$OpenEXRConfig" | awk '{print $3}')
            export "$var"="$value"
          done
      
          share/ci/scripts/validate_install.py "$INSTALL_MANIFEST_PATH" "share/ci/install_manifest/$INSTALL_MANIFEST_FILENAME"
        shell: bash

      - name: Test
        if: inputs.BUILD_TESTING == 'ON' && inputs.RUN_TESTING == 'ON' && inputs.msystem == ''
        env:
          TEST_CATEGORY: ${{ inputs.test_category }}
        run: |
          set -x
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$OPENEXR_PATH:$PATH"
          fi
          CATEGORY_ARGS=()
          if [[ -n "$TEST_CATEGORY" ]]; then
            CATEGORY_ARGS=(-L "$TEST_CATEGORY")
          fi
          cd "$BUILD_DIR"
          "$CTEST" -T Test -C ${{ inputs.build-type }} --timeout 7200 --output-on-failure "${CATEGORY_ARGS[@]}" -VV
        shell: bash

      - name: Test (msys2) # requires msys2 shell
        if: inputs.BUILD_TESTING == 'ON' && inputs.RUN_TESTING == 'ON' && inputs.msystem != ''
        env:
          TEST_CATEGORY: ${{ inputs.test_category }}
        run: |
          set -x
          export PATH="$OPENEXR_PATH:$PATH"
          CATEGORY_ARGS=()
          if [[ -n "$TEST_CATEGORY" ]]; then
            CATEGORY_ARGS=(-L "$TEST_CATEGORY")
          fi
          cd "$BUILD_DIR"
          "$CTEST" -T Test -C ${{ inputs.build-type }} --timeout 7200 --output-on-failure "${CATEGORY_ARGS[@]}" -VV
        shell: msys2 {0}

      - name: Test website examples
        # Build the "hello, world" exrwriter example program from the
        # website, both to confirm it builds and as an example of an
        # application building against the just-installed openexr
        # libary, to validate the cmake configuration for downstream
        # applications.
        if: inputs.namespace == '' && inputs.msystem == '' && inputs.OPENEXR_BUILD_EXAMPLES != ''
        run: |
          set -x
          EXRWRITER_BUILD_DIR=$WORKSPACE/_build.exrwriter
          "$CMAKE" -S website/src/exrwriter -B "$EXRWRITER_BUILD_DIR" \
                -DCMAKE_PREFIX_PATH="$INSTALL_DIR" \
                -DCMAKE_VERBOSE_MAKEFILE=ON
          "$CMAKE" --build "$EXRWRITER_BUILD_DIR" --config ${{ inputs.build-type }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$OPENEXR_PATH:$PATH"
            EXRWRITER=$EXRWRITER_BUILD_DIR/${{ inputs.build-type }}/exrwriter.exe
            EXRINFO=$INSTALL_DIR/bin/exrinfo.exe
          else
            EXRWRITER=$EXRWRITER_BUILD_DIR/exrwriter
            EXRINFO=$INSTALL_DIR/bin/exrinfo
          fi
          "$EXRWRITER"
          # Validate that the image is as expected
          if [ -x "$EXRINFO" ]; then
            expected_output=$(<website/src/exrwriter/stripes.exrinfo.txt)
            actual_output=$("$EXRINFO" stripes.exr)
            if [[ "$actual_output" != "$expected_output" ]]; then
              echo "error: exrwriter produced incorrect results:"
              echo "$actual_output"
              exit 1
            fi
          else
            echo "skipping exrinfo, no tool found."
          fi
        shell: bash

      - name: Test add_subdirectory
        # Build the "hello, world" exrwriter example program from the
        # src/test/add_subdirectory folder, which is the same program as
        # above but configured via add_subdirectory(ext/openexr).
        # Create ext/openexr as a symlink to the repo root. This
        # confirms that downstream applications can use openexr in
        # that way.
        if: inputs.msystem == ''
        run: |
          set -x
          "$CMAKE" --version
          SRC="$RUNNER_TEMP/add_subdirectory"
          cp -r "$WORKSPACE/src/test/add_subdirectory" "$SRC"
          cp "$WORKSPACE/website/src/exrwriter/exrwriter.cpp" "$SRC"
          mkdir -p "$SRC/ext"
          ln -s "$WORKSPACE" "$SRC/ext/openexr"
          ADD_SUBDIRECTORY_BUILD_DIR=$WORKSPACE/_build.add_subdirectory
          cmake_args=("-B" "$ADD_SUBDIRECTORY_BUILD_DIR" -S "$SRC")
          cmake_args+=("-DCMAKE_POLICY_VERSION_MINIMUM=3.26")
          cmake_args+=("-DCMAKE_VERBOSE_MAKEFILE=ON")
          # Consolidate every target's runtime output (the exrwriter
          # executable, OpenEXR's own DLLs, and the DLLs of any
          # dependency fetched/added as its own subproject, e.g.
          # Imath, which doesn't otherwise share OpenEXR's output
          # directory) into one directory. On Windows this is
          # required so the dynamic loader can find them all at
          # runtime; relying on the main install's "bin"/"lib"
          # directories (as below) is not sufficient, since those are
          # empty of DLLs for a static ("BUILD_SHARED_LIBS=OFF")
          # build, even though this add_subdirectory project always
          # builds shared libraries by default.
          cmake_args+=("-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$ADD_SUBDIRECTORY_BUILD_DIR/bin")
          if [ -n "${{ inputs.namespace }}" ]; then
            cmake_args+=("-DOPENEXR_IMF_NAMESPACE=${{ inputs.namespace }}")
          fi
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_IMATH=${{ inputs.OPENEXR_FORCE_INTERNAL_IMATH }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_DEFLATE=${{ inputs.OPENEXR_FORCE_INTERNAL_DEFLATE }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_ZSTD=${{ inputs.OPENEXR_FORCE_INTERNAL_ZSTD }}")
          cmake_args+=("-DOPENEXR_FORCE_INTERNAL_OPENJPH=${{ inputs.OPENEXR_FORCE_INTERNAL_OPENJPH }}")
          cmake_args+=("-DOPENEXR_BUILD_EXAMPLES=OFF")
          cmake_args+=("-DOPENEXR_BUILD_TOOLS=OFF")
          quoted_args=$(printf '%q ' "${cmake_args[@]}")
          # shellcheck disable=SC2086 # intentional word-splitting of pre-quoted args
          "$CMAKE" $quoted_args
          "$CMAKE" --build "$ADD_SUBDIRECTORY_BUILD_DIR" --config ${{ inputs.build-type }}
          # "bin" matches the CMAKE_RUNTIME_OUTPUT_DIRECTORY set above,
          # which every target here (including exrwriter) now shares.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Put this project's own consolidated DLL output directory
            # ahead of $OPENEXR_PATH, so its freshly-built DLLs (not
            # the main install's, which may not exist/match for a
            # static build) are what's loaded at runtime.
            export PATH="$ADD_SUBDIRECTORY_BUILD_DIR/bin/${{ inputs.build-type }}:$OPENEXR_PATH:$PATH"
            EXRWRITER=$ADD_SUBDIRECTORY_BUILD_DIR/bin/${{ inputs.build-type }}/exrwriter.exe
          else
            EXRWRITER=$ADD_SUBDIRECTORY_BUILD_DIR/bin/exrwriter
          fi
          $EXRWRITER
        shell: bash
