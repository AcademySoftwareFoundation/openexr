# Copyright Contributors to the OpenEXR Project.
#
# Build and test OpenEXR as 32-bit x86 (i686) ELF on an amd64 GitHub runner
# using GCC multilib (-m32). Catches regressions that only show up on 32-bit
# Linux (e.g. issue #1284 / testOptimizedInterleavePatterns).
#
# Pattern: standalone workflow, same path filters as ci_freebsd.yml.

name: CI (Linux i686)

on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_linux_i686.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!website/**'
      - '!bazel/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ci_linux_i686.yml'

permissions:
  contents: read

jobs:
  linux-i686:
    name: Linux i686 (-m32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install multilib toolchain
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            gcc-multilib g++-multilib libc6-dev-i386

      - name: Configure
        run: |
          set -ex
          # OJPH_DISABLE_SSE excludes ojph_codestream_sse.cpp, which is
          # compiled with -msse but uses SSE2-only intrinsics; that mismatch
          # is harmless on x86_64 (SSE2 is baseline there) but fails to build
          # under -m32, where -msse does not imply SSE2. Fixed upstream in
          # OpenJPH commit 8ca3abd ("Don't use SSE2 into SSE code (fix build
          # buid for i686)"); remove this once the vendored external/OpenJPH
          # is updated to a release that includes it.
          #
          # OPENEXR_FORCE_INTERNAL_ZSTD avoids linking against the runner's
          # system libzstd, which is amd64-only and incompatible with -m32.
          #
          # CMAKE_SYSTEM_PROCESSOR=i686 corrects the internal zstd build's
          # amd64 vs. i386 detection (src/lib/OpenEXRCore/CMakeLists.txt),
          # which otherwise still reports the host's x86_64 processor under
          # -m32 and wrongly includes the amd64-only huf_decompress_amd64.S
          # assembly file.
          cmake -B _build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_PROCESSOR=i686 \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
            -DOPENEXR_FORCE_INTERNAL_IMATH=ON \
            -DOPENEXR_FORCE_INTERNAL_DEFLATE=ON \
            -DOPENEXR_FORCE_INTERNAL_OPENJPH=ON \
            -DOJPH_DISABLE_SSE=ON \
            -DOPENEXR_FORCE_INTERNAL_ZSTD=ON \
            -DBUILD_TESTING=ON
        shell: bash

      - name: Build
        run: |
          set -ex
          cmake --build _build --parallel "$(nproc)"
        shell: bash

      - name: Test
        run: |
          set -ex
          ctest --test-dir _build --output-on-failure --timeout 7200
        shell: bash
