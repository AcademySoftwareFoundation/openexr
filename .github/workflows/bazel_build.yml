name: Bazel

# Skip the run on changes to all cmake-related files (since this is
# the bazel build) and on changes to the website, *except* for
# "website/src", since that code needs validation. 

on:
  push:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!cmake/**'
      - '!CMakeLists.txt'
      - '!**/CMakeLists.txt'
      - '!CMakePresets.json'
      - '!docs/**'
      - '!share/ci/**'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/bazel_build.yml'
  pull_request:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!cmake/**'
      - '!CMakeLists.txt'
      - '!**/CMakeLists.txt'
      - '!CMakePresets.json'
      - '!docs/**'
      - '!share/ci/**'
      - '!**.md'
      - '!website/**'
      - 'website/src/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/bazel_build.yml'

permissions:
  contents: read

concurrency:
  # Key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # would fire both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither would cancel the other.
  #
  # This only matters for branches that live in *this* repo with an open
  # PR against it, i.e. feature branch merge PRs and dependabot PRs.
  # contributor's push (which runs in the fork) can never collide with

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  build_and_test_ubuntu:
    name: Linux Ubuntu 26.04 Bazel build <GCC 15>
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-ubuntu-26

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...

  build_and_test_windows:
    name: Windows Server 2025 build <Visual Studio 2022>
    if: github.event.pull_request.draft != true
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-windows-2025

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...

  build_and_test_macos:
    name: macOS 26 Bazel build <Apple Clang15>
    if: github.event.pull_request.draft != true
    runs-on: macos-26

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Mount Bazel cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-macos-26

    - name: Build
      run: |
        bazel build //...
        bazel test --test_output=errors //...
