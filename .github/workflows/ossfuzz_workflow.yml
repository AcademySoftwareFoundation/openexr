name: OSS-Fuzz

# Skip the run on *.md changes and on changes to the website.
# Also, no need to run on changes to the bazel setup.

on:
  push:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'
  pull_request:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'

permissions:
  contents: read

concurrency:
  # Key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # would fire both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither would cancel the other.
  #
  # This only matters for branches that live in *this* repo with an open
  # PR against it, i.e. feature branch merge PRs and dependabot PRs.
  # contributor's push (which runs in the fork) can never collide with

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@32f1d4deadc82279ec9001a837f2424e185c69a2 # master
      with:
        oss-fuzz-project-name: 'openexr'
        dry-run: false
        language: c++
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@32f1d4deadc82279ec9001a837f2424e185c69a2 # master
      with:
        oss-fuzz-project-name: 'openexr'
        fuzz-seconds: 300
        dry-run: false
        language: c++
    - name: Upload Crash
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
