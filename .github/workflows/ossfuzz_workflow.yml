name: OSS-Fuzz

# Skip the run on *.md changes and on changes to the website.
# Also, no need to run on changes to the bazel setup.

on:
  push:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'
  pull_request:
    paths:
      - '**'
      - '!ASWF/**'
      - '!Contrib/**'
      - '!CODEOWNERS'
      - '!.mailmap'
      - '!.git-blame-ignore-revs'
      - '!.gitignore'
      - '!sonar-project.properties'
      - '!pyproject.toml'
      - '!share/util/**'
      - '!**/*bazel*'
      - '!**.md'
      - '!website/**'
      - '!src/wrappers/**'
      - '!.github/workflows/**'
      - '.github/workflows/ossfuzz_workflow.yml'

permissions:
  contents: read

concurrency:
  # Key on the source branch name (head_ref for pull_request events,
  # ref_name for push/tag events) rather than github.ref, so a push-triggered
  # run and the pull_request-triggered run for the same branch share one
  # concurrency group. Without this, pushing to a branch with an open PR
  # would fire both a push run (github.ref = refs/heads/<branch>) and a
  # pull_request run (github.ref = refs/pull/<n>/merge) in *different*
  # groups, so neither would cancel the other.
  #
  # This only matters for branches that live in *this* repo with an open
  # PR against it, i.e. feature branch merge PRs and dependabot PRs.
  # contributor's push (which runs in the fork) can never collide with

  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: 300
    steps:
    - name: Checkout OpenEXR
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: openexr

    - name: Checkout OSS-Fuzz
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: google/oss-fuzz
        path: oss-fuzz

    - name: Build Fuzzers
      id: build
      working-directory: oss-fuzz
      run: python3 infra/helper.py build_fuzzers --sanitizer address openexr "$GITHUB_WORKSPACE/openexr"

    - name: Check Fuzzer Build
      working-directory: oss-fuzz
      run: python3 infra/helper.py check_build --sanitizer address openexr

    - name: Run Fuzzers
      working-directory: oss-fuzz
      run: |
        # fuzzers - all executables in build/out/openexr/openexr_*_fuzzer
        mapfile -t fuzzers < <(
          find build/out/openexr -maxdepth 1 -type f -executable \
            -name 'openexr_*_fuzzer' -printf '%f\n'
        )
        if [[ ${#fuzzers[@]} -eq 0 ]]; then
          echo "No fuzz targets found" >&2
          exit 1
        fi
        per_target=$(( FUZZ_SECONDS / ${#fuzzers[@]} ))
        if [[ $per_target -lt 10 ]]; then
          per_target=10
        fi
        status=0
        for fuzzer in "${fuzzers[@]}"; do
          echo "::group::Fuzzing $fuzzer for ${per_target}s"
          python3 infra/helper.py run_fuzzer --sanitizer address openexr "$fuzzer" -- \
            -max_total_time="$per_target" -rss_limit_mb=2560 || status=1
          echo "::endgroup::"
        done
        exit $status

    - name: Upload Crash
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: |
          oss-fuzz/build/out/openexr/crash-*
          oss-fuzz/build/out/openexr/leak-*
          oss-fuzz/build/out/openexr/oom-*
          oss-fuzz/build/out/openexr/timeout-*
        if-no-files-found: ignore
