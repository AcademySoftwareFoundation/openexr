version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      day: "monday"
      interval: "weekly"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      day: "monday"
      interval: "weekly"

  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch all MODULE.bazel bumps from a given run into a single PR,
      # instead of one PR per dependency.
      bazel-deps:
        patterns:
          - "*"
