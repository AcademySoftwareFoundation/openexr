#
# SonarCloud analysis configuration file
# https://sonarcloud.io/documentation/analysis/analysis-parameters

sonar.host.url=https://sonarcloud.io

# Required metadata
sonar.organization=academysoftwarefoundation
sonar.projectKey=AcademySoftwareFoundation_openexr
sonar.projectName=OpenEXR
sonar.projectVersion=2.5

# Project links
sonar.links.homepage=http://openexr.com
sonar.links.ci=https://github.com/AcademySoftwareFoundation/openexr/actions
sonar.links.scm=https://github.com/AcademySoftwareFoundation/openexr
sonar.links.issue=https://github.com/AcademySoftwareFoundation/openexr/issues

# Source properties (whole project is analyzed by default; restrict via exclusions)
sonar.sourceEncoding=UTF-8
sonar.exclusions=external/**

# Coverage is tracked for the library itself (src/lib) and python
# module. Exclude code we don't currently measure coverage for: the
# example programs, the command- line tools, plus ImfZip.cpp and
# ImfCRgbaFile.cpp, which are dead/superseded and slated for
# removal. These remain part of static analysis; only coverage is
# excluded.
sonar.coverage.exclusions=src/examples/**,src/bin/**,src/lib/OpenEXR/ImfZip.cpp,src/lib/OpenEXR/ImfCRgbaFile.cpp

# C/C++ analyzer properties
sonar.cfamily.compile-commands=_build/compile_commands.json
sonar.cfamily.gcov.reportsPath=_coverage

