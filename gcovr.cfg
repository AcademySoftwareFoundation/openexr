#
# gcovr configuration, read automatically when gcovr is run from the
# top of the source tree (as the CMake 'coverage' targets do; see
# cmake/coverage.cmake).

root = .

# Coverage is measured for the library itself.
filter = src/lib/

# Test code, and files that are dead/superseded and slated for removal.
exclude = src/test/
exclude = src/lib/OpenEXR/ImfZip.cpp
exclude = src/lib/OpenEXR/ImfCRgbaFile.cpp

exclude-unreachable-branches = yes
exclude-throw-branches = yes

# gcc occasionally records negative hit counts for lines in heavily
# inlined or multi-threaded code; warn instead of failing.
gcov-ignore-parse-errors = negative_hits.warn_once_per_file

# gcovr flags hit counts above 2^32 as suspicious (gcc bug 68080), but a
# full test run legitimately executes hot inner loops, such as
# Imf::IO::writeChars, billions of times. The bogus values produced by
# that bug are close to 2^64, so a much higher threshold still catches them.
gcov-suspicious-hits-threshold = 1099511627776
